name: Weekly tracker update

on:
  schedule:
    # Tuesday and Wednesday mornings, ~8:17 / 7:17 AM Eastern (12:17 UTC).
    # The Wednesday run catches late nflverse or snap-count posts; it changes nothing if Tuesday already published.
    - cron: "17 12 * * 2,3"
  workflow_dispatch:
    inputs:
      through:
        description: "Last week to include (blank = last complete week)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh positions from Ourlads depth charts
        # If Ourlads is down, keep last week's positions and still update the stats.
        continue-on-error: true
        run: python scripts/ourlads.py

      - name: Build tracker data from nflverse
        run: |
          if [ -n "${{ github.event.inputs.through }}" ]; then
            python scripts/build_data.py --through "${{ github.event.inputs.through }}"
          else
            python scripts/build_data.py
          fi

      - name: Publish if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # The "updated" date changes every run, so compare the stats themselves.
          if git diff --cached --quiet -- data/positions.json && \
             python scripts/same_stats.py; then
            echo "No stat changes; nothing to publish."
            git reset -q
            git checkout -- data
            exit 0
          fi
          THROUGH=$(python -c "import json;print(json.load(open('data/combined.json'))['through'])")
          git commit -m "Stats through Week $THROUGH"
          git push
